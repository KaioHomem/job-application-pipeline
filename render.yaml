# Render Blueprint. Create the service from this file:
# render.com -> New -> Blueprint -> pick this repository.
#
# The health check points at /health, not /mcp: the streamable-HTTP endpoint
# rejects a bare GET with no session and no event-stream Accept header, so a
# check against it would report a healthy service as down.
#
# The free plan sleeps after about fifteen minutes with no traffic. The first
# request after that waits for a cold start.
services:
  - type: web
    name: job-application-pipeline-mcp
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8000
